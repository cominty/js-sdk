name: Release

# Publishes to npm when a GitHub release is published.
# Auth is npm trusted publishing (OIDC) — there is no NPM_TOKEN secret.
# Setup and the release checklist: CONTRIBUTING.md#releasing

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      # prepublishOnly runs check, test, build and the smoke test first.
      - name: Publish
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
